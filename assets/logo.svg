<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#13213d"/>
      <stop offset="0.6" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c52"/>
      <stop offset="1" stop-color="#0c1530"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#5ee7ff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <path d="M150 380 H230 L262 412"/>
    <path d="M120 560 H262"/>
    <path d="M170 700 H240 L300 640"/>
    <path d="M874 380 H794 L762 412"/>
    <path d="M904 560 H762"/>
    <path d="M854 700 H784 L724 640"/>
  </g>
  <g fill="#5ee7ff" fill-opacity="0.6">
    <circle cx="150" cy="380" r="9"/><circle cx="120" cy="560" r="9"/><circle cx="170" cy="700" r="9"/>
    <circle cx="874" cy="380" r="9"/><circle cx="904" cy="560" r="9"/><circle cx="854" cy="700" r="9"/>
  </g>

  <!-- shield -->
  <path filter="url(#glow)" d="M512 180 L770 278 V520 C770 690 660 800 512 864 C364 800 254 690 254 520 V278 Z"
        fill="url(#shield)" stroke="url(#edge)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M512 226 L730 309 V520 C730 664 640 758 512 816 C384 758 294 664 294 520 V309 Z"
        fill="none" stroke="#5ee7ff" stroke-opacity="0.18" stroke-width="4" stroke-linejoin="round"/>

  <text x="512" y="600" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="bold"
 font-size="230" fill="url(#txt)" filter="url(#softglow)">&gt;_</text>
</svg>
