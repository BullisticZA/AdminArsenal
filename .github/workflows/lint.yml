name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; Write-Host "::error file=$($_.FullName)::$($errors -join '; ')" }
          }
          if ($failed) { exit 1 }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./tools -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results | Where-Object Severity -in 'Error', 'Warning') { exit 1 }

  test:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          # Each test file runs in its own process (same PowerShell edition) so its exit code is reliable.
          $exe = (Get-Process -Id $PID).Path
          $failed = 0
          foreach ($t in Get-ChildItem ./tests -Filter *.Tests.ps1) {
            Write-Host "--- $($t.Name)"
            & $exe -NoProfile -ExecutionPolicy Bypass -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed

      - name: Windows smoke test
        run: |
          $exe = (Get-Process -Id $PID).Path
          & $exe -NoProfile -ExecutionPolicy Bypass -File ./tests/Windows.Smoke.ps1
          exit $LASTEXITCODE
